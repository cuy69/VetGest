name: vetgest
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vetgest}
      POSTGRES_USER: ${POSTGRES_USER:-vetgest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env y configura POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  api:
    build:
      context: ./backend
      target: base
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      target: production
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  db-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: vetgest_test
      POSTGRES_USER: vetgest_test
      POSTGRES_PASSWORD: isolated-test-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetgest_test -d vetgest_test"]
      interval: 2s
      timeout: 5s
      retries: 15
  backend-test:
    build:
      context: ./backend
      target: test
    profiles: ["test"]
    environment:
      POSTGRES_HOST: db-test
      POSTGRES_DB: vetgest_test
      POSTGRES_USER: vetgest_test
      POSTGRES_PASSWORD: isolated-test-password
      JWT_SECRET: isolated-test-secret-not-for-production-123456789
      CORS_ORIGINS: '["http://testserver"]'
      TEST_DATABASE_URL: postgresql+psycopg://vetgest_test:isolated-test-password@db-test:5432/vetgest_test
    depends_on:
      db-test:
        condition: service_healthy
  frontend-test:
    build:
      context: ./frontend
      target: test
    profiles: ["test"]
volumes:
  postgres_data:
